spring.application.name=securewebchatroom
server.port=8080

# Secrets live in application-local.properties (not committed). See application-local.properties.example
spring.config.import=optional:classpath:application-local.properties

# ---- Supabase Postgres (set the values in application-local.properties) ----
spring.datasource.url=${DB_URL:jdbc:h2:mem:securewebchatroom;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

# The tables already exist (created from the ERD), so Hibernate only CHECKS them.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# ---- Login token ----
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-text-at-least-32-chars}
app.jwt.expiration-minutes=60

# ---- React dev server ----
app.cors.allowed-origin=http://localhost:5173
